name: False positive
description: A rule reported something that is not actually a problem
title: "[false positive] "
labels: ["false-positive", "high-priority"]
body:
  - type: markdown
    attributes:
      value: |
        False positives are treated as serious defects here: a noisy check teaches
        people to ignore the tool.
  - type: input
    id: rule
    attributes:
      label: Rule id
      placeholder: "AD002"
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: The reported line, copied verbatim.
      render: text
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: The relevant part of your AGENTS.md
      render: markdown
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is not a problem
    validations:
      required: true
